]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=24.1.0",
    "chromadb>=0.6.3",
    "fastapi>=0.115.7",
    "httpx>=0.28.1",
    "jinja2>=3.1.5",
    "logfire[fastapi]>=3.4.0",
    "markdown>=3.7",
    "pydantic-ai-slim[anthropic,logfire]>=0.0.20",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.1",
    "python-dotenv>=1.0.1",
