# fly.toml app configuration file generated for grosbeak on 2024-12-02T20:07:16-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'grosbeak'
primary_region = 'sea'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
